[theme]
base="light"
primaryColor="#D4502C"             # Kiremit/Turuncu (Butonlar ve vurgular için koyulaştırılmış, beyazda net duran spor bir renk)
backgroundColor="#FFFFFF"          # Saf Beyaz (Ana ekranın aydınlık ve ferah arka planı)
secondaryBackgroundColor="#F1F5F9" # Çok uçuk gri-mavi (Yan menü, açıklama barları ve form kutuları için hafif bir ayrım)
textColor="#0F172A"                # Çok koyu lacivert-siyah (Gözü yormayan, kağıt üzerindeki mürekkep gibi duran net yazı rengi)
font="sans serif"
