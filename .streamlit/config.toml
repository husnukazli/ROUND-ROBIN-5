[theme]
base="light"
primaryColor="#B28F40"          # Biraz daha parlatılmış Altın/Hardal rengi (vurgular ve butonlar için)
backgroundColor="#FFFFFF"       # Ana ekran tam beyaz (içerik ve tablolar net olsun diye)
secondaryBackgroundColor="#F0F4F8" # Yan menü çok hafif ve şık bir buz mavisi-gri 
textColor="#1E293B"             # Yazılar derin lacivert-antrasit (siyah yerine çok daha şık)
font="sans serif"
